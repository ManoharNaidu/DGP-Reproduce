# GPU_REPRODUCTION environment (Linux + CUDA 12.x): Qwen3-8B summarization and LoRA tuning.
# conda env create -f environment/gpu.yml && conda activate dgp-gpu && pip install -e .
# Pin exact versions from results/raw/<run_id>/run_manifest.json after the first successful run.
name: dgp-gpu
channels: [conda-forge]
dependencies:
  - python=3.11
  - pip
  - pip:
      - --extra-index-url https://download.pytorch.org/whl/cu124
      - torch>=2.4
      - numpy>=1.24
      - scipy>=1.10
      - scikit-learn>=1.3
      - pandas>=2.0
      - pyyaml>=6.0
      - matplotlib>=3.7
      - pytest>=8
      - transformers>=4.56
      - tokenizers>=0.21
      - peft>=0.13
      - accelerate>=0.34
      - sentencepiece>=0.2
      - protobuf
      - bitsandbytes>=0.43   # only for the flagged memory_optimized (4-bit) mode
