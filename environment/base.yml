# CPU environment: graph building, MDK, prompts, metrics, smoke tests, tokenizer checks.
# conda env create -f environment/base.yml && conda activate dgp-base && pip install -e .
name: dgp-base
channels: [conda-forge]
dependencies:
  - python=3.11
  - pip
  - pip:
      - --extra-index-url https://download.pytorch.org/whl/cpu
      - torch>=2.4
      - numpy>=1.24
      - scipy>=1.10
      - scikit-learn>=1.3
      - pandas>=2.0
      - pyyaml>=6.0
      - matplotlib>=3.7
      - pytest>=8
      - transformers>=4.56
      - sentencepiece>=0.2
      - protobuf
