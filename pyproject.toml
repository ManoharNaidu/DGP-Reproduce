[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "dgp-repro"
version = "0.1.0"
description = "Reproduction of DGP: A Dual-Granularity Prompting Framework for Fraud Detection with Graph-Enhanced LLMs (AAAI-26). PAPER_RECONSTRUCTION - no official code exists."
readme = "README.md"
requires-python = ">=3.10"
# Core: everything needed for the CPU smoke path (graph building, MDK, prompts, metrics).
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "scikit-learn>=1.3",   # arXiv v1: "All evaluation metrics are computed using the scikit-learn library"
    "pandas>=2.0",
    "pyyaml>=6.0",
    "matplotlib>=3.7",
    "torch>=2.1",
]

[project.optional-dependencies]
# LLM stages: tokenizer checks, DeBERTaV3 embeddings, Qwen3-8B summarization and LoRA tuning.
# Qwen3 support in transformers requires >= 4.51 (see research/llm_provenance.md).
llm = [
    "transformers>=4.56",   # `dtype=` loading argument; Qwen3 needs >= 4.51
    "tokenizers>=0.21",
    "peft>=0.13",
    "accelerate>=0.34",
    "sentencepiece>=0.2",   # DeBERTaV3 tokenizer
    "protobuf",
]
# Paper framework for GNN baselines. DGP's own MDK uses scipy.sparse and does not need DGL.
graph = ["dgl"]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "network: needs internet access (downloads tokenizer files or datasets)",
    "gpu: needs a CUDA GPU",
]
