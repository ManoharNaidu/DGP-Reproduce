# DGP base framework on AmazonInstrument (2026-11-04): the AmazonVideo main configuration (configs/models/dgp.yaml: Qwen3-8B
# summarizer and LoRA classifier, K=2, M=4, B=10, paper stopping rule), on FLAG-Reproduce's benchmark graph.
