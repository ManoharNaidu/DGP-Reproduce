# R1: FLAG's discriminative (causal) line, generated by Qwen3-8B from the target's raw review text (first 1,200
# characters), added to the prompt next to the raw text. Neighbour summaries unchanged. Templates: prompts/dgp/dr_*.
defaults:
  - configs/experiments/dgp_amazon.yaml
variant: R1 disc-in-prompt
templates: {final: dr_final_disc}
target_text:
  disc: {template: dr_discriminative, budget: 40, truncate_chars: 1200, fallback_raw: true}
