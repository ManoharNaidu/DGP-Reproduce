# AmazonVideo — reproduced exactly against paper Table 1.
# Evidence: research/evidence_matrix.md (section D), research/dataset_provenance.md
name: amazonvideo
display_name: AmazonVideo
reproducibility: REPRODUCIBLE
processed_dir: datasets/processed/amazonvideo

source:
  url: https://snap.stanford.edu/data/amazon/productGraph/categoryFiles/reviews_Amazon_Instant_Video_5.json.gz
  raw_path: datasets/raw/amazonvideo/reviews_Amazon_Instant_Video_5.json.gz
  sha256: 7816bf30c235c5261560e6ebd9ff6875c154ed15fb9827f0eded74b2c48c4f54   # computed by this study; not published upstream
  bytes: 9517526

graph:
  relations: [RUR, RPR, RSR]
  # RSR = same rating + same week. Paper prose adds "same product", but only the
  # product-free definition reproduces the reported edge count. See data/amazon.py.
  rsr_product_scope: false
  week_offset_days: 5          # Saturday-aligned weeks
  label:
    min_votes: 1
    threshold: 0.5             # unhelpful (fraud) if helpful/total < 0.5
    # Reviews with no votes. 'benign' reproduces the paper's AUROC/AUPRC pairs (11.8% prevalence);
    # 'unlabeled' (33.3% prevalence) contradicts them. Evidence: research/evidence_matrix.md, Loop 2 addendum.
    zero_vote_label: benign

# Human-readable relation names used in prompts (reconstruction; FraudCoT uses these strings).
relation_labels:
  RUR: Same User
  RPR: Same Product
  RSR: Same Rating

expected:                      # paper Table 1
  nodes: 37126
  edges: 9883406
  edge_types: 3
  frauds: 4379

split:
  sizes: {train: 1299, val: 1299, test: 7425}   # paper Table 1
  seed: 0                      # PAPER_RECONSTRUCTION: fixed split, seeds vary training only
  stratify: true               # PAPER_RECONSTRUCTION

task:
  question: Is this fraud?     # Figure 3 wording; "fraud" = unhelpful review on this dataset
