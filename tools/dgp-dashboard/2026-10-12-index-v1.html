<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>DGP extension tracker</title><link rel="stylesheet" href="/palette.css">
<style>
body{margin:0;font:14px system-ui;background:var(--bg);color:var(--fg)}
header{position:sticky;top:0;background:linear-gradient(var(--wash),var(--bg));border-bottom:1px solid var(--line);padding:8px 16px;display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center}
h1{font-size:16px;margin:0 auto 0 0}h2{font-size:14px;margin:20px 0 6px}
main{max-width:1000px;margin:0 auto;padding:8px 16px 40px}
.pill{display:inline-flex;gap:6px;align-items:center;padding:2px 10px;border:1px solid var(--line);border-radius:99px;min-height:24px}
.ring{--p:0;width:18px;height:18px;border-radius:50%;background:conic-gradient(var(--accent) calc(var(--p)*1%),var(--line) 0)}
.ring::after{content:"";display:block;margin:4px;width:10px;height:10px;border-radius:50%;background:var(--bg)}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:5px 8px;border-bottom:1px solid var(--line);min-height:24px}
th{font-weight:600;color:var(--muted)}td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
.ok{color:var(--ok)}.bad{color:var(--bad)}.warn{color:var(--warn)}.mut{color:var(--muted)}
.bar{height:3px;background:var(--line);border-radius:2px;margin-top:3px}.bar i{display:block;height:3px;background:var(--accent);border-radius:2px}
.row{display:grid;grid-template-columns:minmax(120px,15em) 1fr 7em;gap:8px;align-items:center;padding:4px 0;border-bottom:1px solid var(--line)}
.sec{max-height:none}.empty{color:var(--muted);padding:8px 0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media(max-width:560px){.row{grid-template-columns:1fr 6em}.row .bw{grid-column:1/-1;order:3}}
@media(prefers-reduced-motion:no-preference){.bar i{transition:width .4s}}
</style></head><body>
<header><h1>DGP extension tracker</h1><span id="verdict" class="pill" role="status"></span><span id="gpus"></span><span id="upd" class="mut"></span></header>
<main>
<h2 id="hr">Results · AmazonVideo test, mean ± std over seeds (percent)</h2>
<div id="res" aria-labelledby="hr"></div>
<h2 id="hg">Generation progress</h2><div id="gen" aria-labelledby="hg"></div>
<h2 id="hn">Neighbours by K (LLM-free analysis)</h2><div id="nb" aria-labelledby="hn"></div>
<h2 id="hq">Queue</h2><div id="q" aria-labelledby="hq"></div>
</main><script>
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const f=(x,d=2)=>x==null?'–':x.toFixed(d);
const SH={done:'● done',running:'▶ running',failed:'✖ failed',waiting:'○ waiting'},CL={done:'ok',running:'warn',failed:'bad',waiting:'mut'};
const delta=(d)=>d==null?'':`<span class="${d>0.5?'ok':d<-0.5?'bad':'mut'}">${d>0?'▲':d<0?'▼':'■'} ${d>0?'+':''}${d.toFixed(2)}</span>`;
function secs(s){if(s==null)return'';return s>=3600?(s/3600).toFixed(1)+' h':Math.round(s/60)+' min'}
function elapsed(t){return secs((Date.now()-new Date(t+'Z').getTime())/1000)}
async function load(){
 let s;try{s=await (await fetch('/api/state')).json()}catch(e){document.getElementById('verdict').textContent='dashboard offline – retrying';return}
 const J=s.jobs,c=k=>J.filter(j=>j.state==k).length;
 document.getElementById('verdict').innerHTML=`<b>${c('done')}/${J.length}</b> jobs done · <span class="warn">${c('running')} running</span> · <span class="${c('failed')?'bad':'mut'}">${c('failed')} failed</span>`;
 document.getElementById('gpus').innerHTML=s.gpus.map(g=>`<span class="pill" title="GPU ${g.index}: ${g.used} / ${g.total} MiB"><span class="ring" style="--p:${g.util}"></span>GPU ${g.index} ${g.util}% · ${(g.used/1024).toFixed(0)} GB</span>`).join(' ');
 document.getElementById('upd').textContent='updated '+s.updated;
 // results
 const base=s.results.find(r=>r.exp.startsWith('dgp_amazonvideo'));
 document.getElementById('res').innerHTML='<table><thead><tr><th scope="col">Arm</th><th scope="col" class="n">Seeds</th><th scope="col" class="n">Macro-F1</th><th scope="col" class="n">AUROC</th><th scope="col" class="n">AUPRC</th><th scope="col" class="n">Δ AUROC vs A</th><th scope="col" class="n">min/seed</th></tr></thead><tbody>'+
  s.results.map(r=>r.n?`<tr title="${esc(r.desc)}"><th scope="row">${esc(r.label)}</th><td class="n">${r.n}/5</td><td class="n">${f(r.f1)} ± ${f(r.f1_sd)}</td><td class="n">${f(r.auroc)} ± ${f(r.auroc_sd)}</td><td class="n">${f(r.auprc)} ± ${f(r.auprc_sd)}</td><td class="n">${delta(r.d_auroc)}</td><td class="n">${r.minutes}</td></tr>`
   :`<tr class="mut" title="${esc(r.desc)}"><th scope="row">${esc(r.label)}</th><td class="n">0/5</td><td colspan="5">no finished runs yet</td></tr>`).join('')+'</tbody></table><p class="mut">Δ is against the existing 5-seed baseline (A). Differences under ~1 point are within seed noise (baseline std ≈ 0.5).</p>';
 // generation
 document.getElementById('gen').innerHTML=s.stores.map(t=>{const p=t.expected?Math.min(100,100*t.lines/t.expected):null;return`<div class="row"><span>${esc(t.label)}</span><span class="bw"><div class="bar" role="progressbar" aria-label="${esc(t.label)}" aria-valuenow="${p==null?0:p.toFixed(0)}" aria-valuemin="0" aria-valuemax="100"><i style="width:${p==null?0:p}%"></i></div></span><span class="n">${t.lines.toLocaleString()}${t.expected?' / '+t.expected.toLocaleString():''}</span></div>`}).join('')||'<div class="empty">no caches</div>';
 // neighbours
 const N=s.neighbours;
 document.getElementById('nb').innerHTML=!N?`<div class="empty">analysis not finished yet (K=3 MDK trimming: ${s.mdk_k3}/39 metapaths)</div>`:
  '<table><thead><tr><th scope="col">K</th><th scope="col" class="n">metapaths</th><th scope="col" class="n">kept nbrs</th><th scope="col" class="n">unique</th><th scope="col" class="n">dup ratio</th><th scope="col" class="n">raw tokens</th><th scope="col" class="n">nbr fraud rate | target fraud</th><th scope="col" class="n">| benign</th></tr></thead><tbody>'+
  N.stats.filter(r=>r.metapath==='ALL').map(r=>`<tr><th scope="row">${r.K}</th><td class="n">${r.n_metapaths}</td><td class="n">${r.mean_kept}</td><td class="n">${r.unique_nbrs_mean}</td><td class="n">${r.dup_ratio}</td><td class="n">${Math.round(r.mean_kept_raw_tokens).toLocaleString()}</td><td class="n">${r.nbr_fraud_rate_if_target_fraud}</td><td class="n">${r.nbr_fraud_rate_if_target_benign}</td></tr>`).join('')+'</tbody></table>';
 // queue
 document.getElementById('q').innerHTML=J.map(j=>`<div class="row"><span>${esc(j.name)} <span class="mut">${j.group}</span></span><span class="${CL[j.state]}">${SH[j.state]}${j.gpu!=null?' · GPU '+j.gpu:''}</span><span class="n mut">${j.state==='running'&&j.started?elapsed(j.started):j.seconds?secs(j.seconds):''}</span></div>`).join('');
}
load();setInterval(load,5000);
</script></body></html>
