<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DGP Progress</title>
<style>
:root {
  color-scheme: light;
  --bg: #f5f4f0; --surface: #fcfcfb; --surface-2: #f0efea; --border: #e1e0d9;
  --text: #0b0b0b; --text-2: #52514e; --muted: #6b6a64; --grid: #e1e0d9;
  --s-r0: #2a78d6; --s-x0: #1baf7a; --s-g0: #eb6834; --s-qg0: #8a5cd6;
  --good: #1a7f37; --warn: #b26a00; --bad: #c62828; --run: #2a78d6;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #111110; --surface: #1a1a19; --surface-2: #232321; --border: #33332f;
    --text: #f0efec; --text-2: #c3c2b7; --muted: #9a998f; --grid: #33332f;
    --s-r0: #3987e5; --s-x0: #199e70; --s-g0: #d95926; --s-qg0: #9d74e8;
    --good: #4cc26a; --warn: #e0a23a; --bad: #ef6b6b; --run: #3987e5;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #111110; --surface: #1a1a19; --surface-2: #232321; --border: #33332f;
  --text: #f0efec; --text-2: #c3c2b7; --muted: #9a998f; --grid: #33332f;
  --s-r0: #3987e5; --s-x0: #199e70; --s-g0: #d95926; --s-qg0: #9d74e8;
  --good: #4cc26a; --warn: #e0a23a; --bad: #ef6b6b; --run: #3987e5;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
main { max-width: 1180px; margin: 0 auto; padding: 20px 16px 48px; }
h1 { font-size: 20px; margin: 0; letter-spacing: -0.01em; }
h2 { font-size: 15px; margin: 0 0 10px; }
.sub { color: var(--text-2); margin: 4px 0 0; }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 16px; margin-top: 14px; }
details.card { padding: 0; }
details.card > summary { list-style: none; cursor: pointer; padding: 14px 16px; display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; }
details.card > summary::-webkit-details-marker { display: none; }
details.card > summary::before { content: "▸"; color: var(--muted); transition: transform .15s; }
details.card[open] > summary::before { transform: rotate(90deg); }
details.card > .inner { padding: 0 16px 16px; }
.st { font-weight: 600; }
.head { display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-start; justify-content: space-between; }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 10px; margin-top: 14px; }
.tile { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; }
.tile .k { color: var(--muted); font-size: 12px; }
.tile .v { font-size: 22px; font-weight: 600; margin-top: 2px; font-variant-numeric: tabular-nums; }
.tile .n { color: var(--text-2); font-size: 12px; margin-top: 2px; }
.badge { display: inline-flex; align-items: center; gap: 6px; padding: 2px 9px; border-radius: 999px; font-size: 12px;
         font-weight: 600; border: 1px solid currentColor; white-space: nowrap; }
.st-running { color: var(--run); } .st-done { color: var(--good); } .st-failed { color: var(--bad); }
.st-next { color: var(--warn); }
.st-queued, .st-stopped, .st-not, .st-waiting, .st-deferred, .st-yours { color: var(--muted); }
.dot { width: 8px; height: 8px; border-radius: 50%; background: currentColor; }
.st-running .dot { animation: pulse 1.6s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: .3; } }
.bar { height: 8px; background: var(--surface-2); border-radius: 4px; overflow: hidden; margin-top: 8px; }
.bar > i { display: block; height: 100%; background: var(--run); border-radius: 4px; }
.scroll { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
th, td { text-align: left; padding: 7px 8px; border-bottom: 1px solid var(--border); white-space: nowrap; vertical-align: middle; }
th { color: var(--muted); font-weight: 500; font-size: 12px; }
td.num, th.num { text-align: right; }
td.wrap { white-space: normal; min-width: 260px; }
.lane { color: var(--muted); font-size: 12px; }
.small { font-size: 12px; color: var(--text-2); }
button { font: inherit; font-size: 12px; color: var(--text); background: var(--surface-2); border: 1px solid var(--border);
         border-radius: 6px; padding: 3px 9px; cursor: pointer; }
button:hover { border-color: var(--muted); }
pre { background: var(--surface-2); border: 1px solid var(--border); border-radius: 8px; padding: 10px; margin: 10px 0 0;
      max-height: 360px; overflow: auto; font-size: 12px; white-space: pre-wrap; word-break: break-word; }
.charts { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 14px; }
.legend { display: flex; flex-wrap: wrap; gap: 14px; font-size: 12px; color: var(--text-2); margin: 2px 0 10px; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.sw { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
svg text { fill: var(--muted); font-size: 11px; }
.tip { position: fixed; pointer-events: none; background: var(--surface); color: var(--text); border: 1px solid var(--border);
       border-radius: 8px; padding: 6px 9px; font-size: 12px; box-shadow: 0 4px 16px rgba(0,0,0,.12); display: none; z-index: 9; }
.ev { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; color: var(--text-2); }
.two { display: grid; grid-template-columns: 1.4fr 1fr; gap: 14px; }
@media (max-width: 820px) { .two { grid-template-columns: 1fr; } }
.pos { color: var(--good); } .neg { color: var(--bad); }
.note { color: var(--text-2); font-size: 12px; margin: 8px 0 0; }
.err { color: var(--bad); }
.kind { font-size: 11px; color: var(--muted); border: 1px solid var(--border); border-radius: 4px; padding: 0 5px; }
.grow { flex: 1; min-width: 200px; font-weight: 600; }
</style>
</head>
<body>
<main>
  <div class="head">
    <div>
      <h1>DGP progress</h1>
      <p class="sub">Follow-up work on DGP-Reproduce (AmazonVideo): the plan, every GPU queue, and results as they arrive.</p>
    </div>
    <div id="qbadge"></div>
  </div>

  <div class="tiles" id="tiles"></div>
  <div class="card"><h2>Plan</h2><div class="scroll"><table id="plan"></table></div><p class="note" id="plannote"></p></div>
  <div id="queues"></div>
  <details class="card" data-key="sel" id="selres"></details>
  <details class="card" data-key="baselines" id="baselines"></details>
  <details class="card" data-key="exp4" id="exp4"></details>
  <div class="two">
    <div class="card"><h2>GPU</h2><div id="gpu"></div></div>
    <div class="card"><h2>Queue events</h2><div id="events"></div></div>
  </div>
  <p class="small" style="margin-top:14px">Refreshes every 15 s · <span id="stamp">loading…</span></p>
</main>
<div class="tip" id="tip"></div>
<script>
const TOKEN = new URLSearchParams(location.search).get("token");
const q = (p) => p + (TOKEN ? (p.includes("?") ? "&" : "?") + "token=" + encodeURIComponent(TOKEN) : "");
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));
const f2 = (x) => (x == null || isNaN(x) ? "—" : Number(x).toFixed(2));
const sg = (x) => (x == null || isNaN(x) ? "—" : (x >= 0 ? "+" : "−") + Math.abs(x).toFixed(2));
const dur = (s) => { if (s == null) return "—"; s = Math.round(s); const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60);
  return h ? `${h} h ${String(m).padStart(2, "0")} min` : `${m} min`; };
const hhmm = (t) => (t ? esc(String(t).slice(11, 16)) + " UTC" : "—");
const COL = {dr_R0: "--s-r0", gs_X0: "--s-x0", gs_G0: "--s-g0", gs_QG0: "--s-qg0"};
const MET = [["auroc", "AUROC"], ["auprc", "AUPRC"], ["macro_f1", "Macro-F1"]];
const STLABEL = {running: "running", done: "done", failed: "failed", queued: "queued", stopped: "stopped",
  "not started": "not started", next: "next", waiting: "waiting", deferred: "deferred", yours: "yours"};
const badge = (st, label) => `<span class="badge st-${esc(String(st).split(" ")[0])}"><span class="dot"></span>${esc(label || STLABEL[st] || st)}</span>`;
const mean = (a) => a.reduce((x, y) => x + y, 0) / a.length;
const std = (a) => { const m = mean(a); return Math.sqrt(mean(a.map((x) => (x - m) ** 2))); };
const openState = {};   // details key -> open, as the viewer left it
const openLog = {};     // queue key -> job whose log is shown

const tip = $("tip");
function showTip(e, html) { tip.innerHTML = html; tip.style.display = "block";
  const r = tip.getBoundingClientRect(); let x = e.clientX + 14, y = e.clientY + 14;
  if (x + r.width > innerWidth - 8) x = e.clientX - r.width - 14; if (y + r.height > innerHeight - 8) y = e.clientY - r.height - 14;
  tip.style.left = x + "px"; tip.style.top = y + "px"; }
document.addEventListener("mousemove", (e) => { const t = e.target.closest("[data-tip]"); t ? showTip(e, t.dataset.tip) : (tip.style.display = "none"); });
document.addEventListener("toggle", (e) => { const d = e.target; if (d.dataset && d.dataset.key) openState[d.dataset.key] = d.open; }, true);
const isOpen = (key, dflt) => (key in openState ? openState[key] : dflt);

function epochChart(h, best, alt) {
  if (!h || !h.length) return '<span class="small">—</span>';
  const W = 150, H = 34, n = 10, v = h.map((x) => x.val_auroc), lo = Math.min(...v) - 0.4, hi = Math.max(...v) + 0.4;
  const X = (i) => 6 + i * (W - 12) / (n - 1), Y = (y) => H - 5 - (y - lo) / (hi - lo) * (H - 10);
  const pts = v.map((y, i) => `${X(i).toFixed(1)},${Y(y).toFixed(1)}`).join(" ");
  let s = `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="validation AUROC per epoch">`;
  s += `<line x1="6" x2="${W - 6}" y1="${H - 2}" y2="${H - 2}" stroke="var(--grid)"/>`;
  s += `<polyline points="${pts}" fill="none" stroke="var(--run)" stroke-width="2" stroke-linejoin="round"/>`;
  h.forEach((x, i) => {
    const t = `Epoch ${Number(x.epoch)}<br>val loss ${Number(x.val_loss).toFixed(4)}<br>val AUROC ${f2(x.val_auroc)} · AUPRC ${f2(x.val_auprc)}<br>val Macro-F1 ${f2(x.val_macro_f1)}${x.epoch === best ? "<br><b>kept by the paper rule (val loss)</b>" : ""}${alt && x.epoch === alt ? "<br><b>best val AUROC</b>" : ""}`;
    s += `<circle cx="${X(i)}" cy="${Y(x.val_auroc)}" r="${x.epoch === best ? 4.5 : 2.6}" fill="${x.epoch === best ? "var(--surface)" : "var(--run)"}" stroke="var(--run)" stroke-width="2"/>`;
    if (alt && x.epoch === alt && alt !== best) s += `<rect x="${X(i) - 4}" y="${Y(x.val_auroc) - 4}" width="8" height="8" fill="var(--run)" stroke="var(--surface)" stroke-width="1.5"/>`;
    s += `<rect x="${X(i) - 7}" y="0" width="14" height="${H}" fill="transparent" data-tip="${esc(t)}"/>`;
  });
  return s + "</svg>";
}

function queueCard(Q) {
  const runs = Q.jobs.filter((r) => r.experiment), done = runs.filter((r) => r.state === "done").length;
  const sumr = `<span class="grow">${esc(Q.title)}</span>${badge(Q.state)}<span class="small">${done} / ${runs.length} runs · ${
    Q.state === "done" ? `finished ${hhmm(Q.ended)} after ${dur(Q.elapsed_s)}` : Q.state === "running" ? `expected finish ${esc(Q.eta.finish || "—")}` : `started ${hhmm(Q.started)}`}</span>`;
  const M = Q.multi_rule;
  let s = `<tr><th>Lane</th><th>Job</th><th>State</th><th>Now</th><th class="num">Elapsed</th><th>Val AUROC by epoch</th>
           <th class="num">${M ? "Kept ep. (loss · AUROC)" : "Best ep."}</th>${M ? `<th class="num">Test AUROC (loss · AUROC rule)</th><th class="num">Test AUPRC (loss · AUROC rule)</th>` : `<th class="num">Test AUROC</th><th class="num">Test AUPRC</th>`}<th class="num">Test F1</th><th></th></tr>`;
  for (const r of Q.jobs) {
    const name = r.experiment ? `${r.experiment} · seed ${r.seed}` : "Build prompts";
    const now = r.state === "running" ? esc(r.phase || "running") + (r.phase_note ? `<div class="small">${esc(r.phase_note)}</div>` : "")
              : r.state === "done" ? `<span class="small">${hhmm(r.start)} → ${hhmm(r.end)}</span>`
              : r.state === "failed" ? `<span class="err">exit code ${esc(r.rc)}</span>` : '<span class="small">waiting</span>';
    const t = r.test || {}, u = r.test_auroc_rule || {};
    const pair = (m) => M ? `${f2(t[m])} · ${f2(u[m])}` : f2(t[m]);
    s += `<tr><td class="lane">${esc(r.lane)}</td><td>${esc(name)}${r.experiment === "par2_R0" ? '<div class="small">R0 re-run: stack drift</div>' : ""}</td>
      <td>${badge(r.state)}</td><td>${now}</td><td class="num">${dur(r.elapsed_s)}</td>
      <td>${r.experiment ? epochChart(r.history, r.best_epoch, M ? r.auroc_epoch : null) : ""}</td>
      <td class="num">${esc(r.best_epoch ?? "—")}${M && r.auroc_epoch ? ` · ${esc(r.auroc_epoch)}` : ""}${r.history && r.history.length ? `<span class="small"> / ${r.history.length}</span>` : ""}</td>
      <td class="num">${pair("auroc")}</td><td class="num">${pair("auprc")}</td><td class="num">${f2(t.macro_f1)}</td>
      <td>${r.state !== "queued" ? `<button data-q="${esc(Q.key)}" data-log="${esc(r.job)}">${openLog[Q.key] === r.job ? "Hide log" : "Log"}</button>` : ""}</td></tr>`;
  }
  const open = isOpen("q-" + Q.key, Q.state === "running" || Q.state === "failed");
  return `<details class="card" data-key="q-${esc(Q.key)}"${open ? " open" : ""}><summary>${sumr}</summary><div class="inner">
    <div class="scroll"><table>${s}</table></div>
    <p class="note">${Q.state === "running" ? `≈ ${dur(Q.eta.remaining_s)} left · ${Q.eta.measured ? "measured" : "estimated"} ${dur(Q.eta.per_run_s)} per run (two runs share the GPU). ` : ""}${M ? "Every run trains all 10 epochs. Ring = epoch the paper rule keeps (early stopping on val loss, patience 2); square = best val AUROC. The test set is scored at each rule's epoch; F1 is the paper rule's. ETA uses measured YelpChi and AmazonVideo run times separately once one of each finishes." : "Early stopping on validation loss, patience 2, at most 10 epochs. Ring = best epoch."}</p>
    <div id="logbox-${esc(Q.key)}"></div></div></details>`;
}

async function loadLogs() {
  for (const [k, job] of Object.entries(openLog)) {
    const el = $("logbox-" + k); if (!el) continue;
    if (!job) { el.innerHTML = ""; continue; }
    try { const t = await (await fetch(q(`/api/log?job=${encodeURIComponent(job)}`))).text();
      el.innerHTML = `<pre aria-label="log tail">${esc(job)}.log (last lines)\n\n${esc(t)}</pre>`; }
    catch (e) { el.innerHTML = '<pre class="err">could not load the log</pre>'; }
  }
}
$("queues").addEventListener("click", (e) => { const b = e.target.closest("button[data-log]"); if (!b) return;
  openLog[b.dataset.q] = openLog[b.dataset.q] === b.dataset.log ? null : b.dataset.log; refresh(); });

function dotChart(cells, m, label, paper) {
  const W = 300, H = 170, L = 44, B = 26, T = 10;
  const all = Object.values(cells).flatMap((c) => Object.values(c.per_seed).map((x) => x[m])).concat([paper]);
  let lo = Math.min(...all), hi = Math.max(...all); const pad = Math.max(0.4, (hi - lo) * 0.12); lo -= pad; hi += pad;
  const Y = (v) => T + (hi - v) / (hi - lo) * (H - T - B), keys = Object.keys(cells), bw = (W - L - 8) / keys.length;
  let s = `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="${esc(label)} per seed">`;
  const step = (hi - lo) > 6 ? 2 : (hi - lo) > 3 ? 1 : 0.5;
  for (let g = Math.ceil(lo / step) * step; g <= hi; g += step)
    s += `<line x1="${L}" x2="${W - 4}" y1="${Y(g)}" y2="${Y(g)}" stroke="var(--grid)"/><text x="${L - 6}" y="${Y(g) + 4}" text-anchor="end">${g.toFixed(step < 1 ? 1 : 0)}</text>`;
  s += `<line x1="${L}" x2="${W - 4}" y1="${Y(paper)}" y2="${Y(paper)}" stroke="var(--muted)" stroke-dasharray="4 3"/>
        <text x="${W - 6}" y="${Y(paper) - 4}" text-anchor="end">paper ${Number(paper)}</text>`;
  keys.forEach((k, i) => {
    const c = cells[k], cx = L + bw * (i + 0.5), v = Object.entries(c.per_seed), col = `var(${COL[k]})`;
    v.forEach(([seed, x], j) => {
      const xx = cx - 14 + (v.length > 1 ? j * 12 / (v.length - 1) : 6);
      s += `<circle cx="${xx}" cy="${Y(x[m])}" r="4" fill="${col}" stroke="var(--surface)" stroke-width="2"
             data-tip="${esc(`${esc(c.short)} · seed ${esc(seed)}<br>${label} ${f2(x[m])}`)}"/>`;
    });
    if (v.length) {
      const a = v.map(([, x]) => x[m]), mu = mean(a), sd = std(a);
      s += `<line x1="${cx + 12}" x2="${cx + 12}" y1="${Y(mu + sd)}" y2="${Y(mu - sd)}" stroke="${col}" stroke-width="2" stroke-linecap="round"/>
            <circle cx="${cx + 12}" cy="${Y(mu)}" r="5.5" fill="${col}" stroke="var(--surface)" stroke-width="2"
             data-tip="${esc(`${esc(c.short)} · ${esc(c.label)}<br>${label} ${f2(mu)} ± ${f2(sd)} (n=${a.length})`)}"/>`;
    }
    s += `<text x="${cx}" y="${H - 8}" text-anchor="middle">${esc(c.short)} (n=${v.length})</text>`;
  });
  return `<div><div class="small" style="font-weight:600;color:var(--text)">${label} (%)</div>${s}</svg></div>`;
}

function renderExp4(d) {
  const E = d.exp4, cells = E.cells, el = $("exp4");
  const full = Object.values(cells).every((c) => Object.keys(c.per_seed).length === 5);
  const legend = Object.entries(cells).map(([k, c]) => `<span><i class="sw" style="background:var(${COL[k]})"></i>${esc(c.short)} · ${esc(c.label)}</span>`).join("")
    + '<span style="color:var(--muted)">small dots = seeds · large dot and bar = mean ± std · dashed = paper</span>';
  let t = `<tr><th>Cell</th><th>Roles</th>${[0, 1, 2, 3, 4].map((x) => `<th class="num">seed ${x} AUROC / AUPRC</th>`).join("")}<th class="num">Mean AUROC</th><th class="num">Mean AUPRC</th><th class="num">Mean F1</th></tr>`;
  for (const [k, c] of Object.entries(cells)) {
    const ps = c.per_seed, a = (m) => Object.values(ps).map((x) => x[m]);
    t += `<tr><td><i class="sw" style="background:var(${COL[k]})"></i> ${esc(c.short)}</td><td class="small">${esc(c.label)}</td>`
      + [0, 1, 2, 3, 4].map((x) => `<td class="num">${ps[x] ? `${f2(ps[x].auroc)} / ${f2(ps[x].auprc)}` : "—"}</td>`).join("")
      + MET.map(([m]) => `<td class="num">${a(m).length ? `${f2(mean(a(m)))} ± ${f2(std(a(m)))}` : "—"}</td>`).join("") + "</tr>";
  }
  let an = "";
  const A = E.analysis;
  if (A && A.comparisons && Object.keys(A.comparisons).length) {
    an = `<h2 style="margin-top:16px">Paired comparisons</h2><div class="scroll"><table><tr><th>Comparison</th><th>What changes</th>`
      + MET.map(([, l]) => `<th class="num">Δ ${l}</th><th class="num">Holm p</th>`).join("") + `<th class="num">95% CI Δ AUROC</th><th class="num">95% CI Δ AUPRC</th></tr>`;
    for (const [k, c] of Object.entries(A.comparisons)) {
      const ci = c.bootstrap_ci95 || {};
      an += `<tr><td>${esc(k)}</td><td class="small">${esc(c.what)}</td>` + MET.map(([m]) => {
        const x = c.metrics[m], p = (c.holm_t_p || {})[m];
        return `<td class="num">${sg(x.delta_mean)} <span class="small">(${esc(x.seeds_better)}/${c.seeds.length})</span></td><td class="num">${p == null ? "—" : Number(p).toFixed(3)}</td>`; }).join("")
        + `<td class="num">${ci.auroc ? `[${sg(ci.auroc[0])}, ${sg(ci.auroc[1])}]` : "—"}</td><td class="num">${ci.auprc ? `[${sg(ci.auprc[0])}, ${sg(ci.auprc[1])}]` : "—"}</td></tr>`;
    }
    an += "</table></div>";
    const D = A.decomposition;
    if (D) an += `<p class="note">Writer share of Gemma's gain: AUROC ${D.auroc && D.auroc.writer_share != null ? Math.round(100 * D.auroc.writer_share) + "%" : "—"}, AUPRC ${D.auprc && D.auprc.writer_share != null ? Math.round(100 * D.auprc.writer_share) + "%" : "—"}; the rest comes from Gemma as the classifier.`
      + (E.par2_R0 && cells.dr_R0.per_seed[0] ? ` Stack drift (R0 seed 0 re-run on this machine): AUROC ${sg(E.par2_R0.auroc - cells.dr_R0.per_seed[0].auroc)}, AUPRC ${sg(E.par2_R0.auprc - cells.dr_R0.per_seed[0].auprc)}.` : "") + "</p>";
    const I = A.interaction;
    if (I && I.auroc) an += `<p class="note">Interaction (G0 − QG0) − (X0 − R0), paired over seeds: AUROC ${sg(I.auroc.interaction_mean)} (p ${I.auroc.t_p == null ? "—" : Number(I.auroc.t_p).toFixed(2)}), AUPRC ${sg(I.auprc.interaction_mean)} (p ${I.auprc.t_p == null ? "—" : Number(I.auprc.t_p).toFixed(2)}); 0 means the writer and classifier effects add up.</p>`;
    if (E.analysis_md) an += `<p class="note"><a href="${esc(q("/files/exp4.md"))}" target="_blank" rel="noopener">Open the analysis</a></p>`;
  }
  el.innerHTML = `<summary><span class="grow">Exp 4 results · writer vs classifier (2 × 2)</span>${badge(A && full ? "done" : "running", A && full ? "analysed" : "in progress")}</summary>
    <div class="inner"><div class="legend">${legend}</div><div class="charts">${MET.map(([m, l]) => dotChart(cells, m, l, E.paper[m])).join("")}</div>
    <div class="scroll" style="margin-top:14px"><table>${t}</table></div>${an}</div>`;
  el.open = isOpen("exp4", false);
}

function renderBaselines(d) {
  const B = d.baselines, el = $("baselines");
  let s = `<tr><th>Method</th><th>What it is</th><th class="num">Seeds</th>` + MET.map(([, l]) => `<th class="num">${l} ours</th><th class="num">paper</th>`).join("") + "</tr>";
  for (const r of B.rows) {
    const v = Object.values(r.per_seed), a = (m) => v.map((x) => x[m]);
    s += `<tr><td><b>${esc(r.short)}</b></td><td class="small">${esc(r.label)}</td><td class="num">${v.length}</td>`
      + MET.map(([m]) => `<td class="num">${v.length ? `${f2(mean(a(m)))} <span class="small">± ${f2(std(a(m)))}</span>` : "—"}</td><td class="num small">${r.paper ? f2(r.paper[m]) : "—"}</td>`).join("") + "</tr>";
  }
  const C = B.graph_context;
  if (C) s += `<tr><td colspan="3"><b>R0 − T0</b> <span class="small">what the graph context adds, paired over seeds ${esc(C.seeds.join(", "))}</span></td>`
    + MET.map(([m]) => `<td class="num ${C[m] > 0 ? "pos" : C[m] < 0 ? "neg" : ""}">${sg(C[m])} <span class="small">(${esc(C.better[m])}/${C.seeds.length})</span></td><td></td>`).join("") + "</tr>";
  const t0 = B.rows.find((r) => r.short === "LLM"), n = t0 ? Object.keys(t0.per_seed).length : 0;
  el.innerHTML = `<summary><span class="grow">Baselines and controls</span>${badge(n === 5 ? "done" : "running", n === 5 ? "complete" : `T0 ${n} / 5 seeds`)}</summary>
    <div class="inner"><div class="scroll"><table>${s}</table></div>
    <p class="note">Test set, AmazonVideo, mean ± std over seeds. "paper" = the DGP paper's Table 2. T0 is the R0 classifier given only the target review; MLP is the CPU baseline re-run on 2026-11-01. Paired differences need the same seeds in both rows.${n === 5 ? ` <a href="${esc(q("/files/controls.md"))}" target="_blank" rel="noopener">Open controls.md</a> (paired t, Holm, bootstrap CIs).` : ""}</p></div>`;
  el.open = isOpen("baselines", true);
}

const RULES = [["loss_es2", "Paper rule", "lowest val loss, early stop (patience 2)"],
  ["auroc_all", "Best val AUROC", "over all 10 epochs"], ["auroc_es2", "AUROC, patience 2", "early stop on val AUROC"],
  ["auroc_es3", "AUROC, patience 3", "early stop on val AUROC"]];
function renderSel(d) {
  const S = d.sel, el = $("selres"); if (!S) return;
  const names = {sel_yelpchi: "YelpChi", sel_amazonvideo: "AmazonVideo"};
  let body = "", total = 0;
  for (const [exp, X] of Object.entries(S)) {
    const seeds = Object.keys(X.seeds).map(Number).sort(), n = seeds.length; total += n;
    let t = `<tr><th>Rule</th>${seeds.map((s) => `<th class="num">seed ${s}<div class="small">ep · AUROC / AUPRC</div></th>`).join("")}`
      + MET.map(([, l]) => `<th class="num">Mean ${l}</th>`).join("") + `<th class="num">Δ AUROC vs paper rule</th><th class="num">Δ AUPRC vs paper rule</th></tr>`;
    for (const [r, label, note] of RULES) {
      const v = (m) => seeds.map((s) => X.seeds[s][r][m]), dl = (m) => seeds.map((s) => X.seeds[s][r][m] - X.seeds[s].loss_es2[m]);
      const better = (m) => dl(m).filter((x) => x > 0).length;
      t += `<tr><td>${esc(label)}<div class="small">${esc(note)}</div></td>`
        + seeds.map((s) => { const c = X.seeds[s][r]; return `<td class="num">${esc(c.epoch)} · ${f2(c.auroc)} / ${f2(c.auprc)}</td>`; }).join("")
        + MET.map(([m]) => `<td class="num">${n ? f2(mean(v(m))) : "—"}</td>`).join("")
        + (r === "loss_es2" ? `<td class="num">—</td><td class="num">—</td>` : ["auroc", "auprc"].map((m) => {
            const x = n ? mean(dl(m)) : null;
            return `<td class="num ${x > 0 ? "pos" : x < 0 ? "neg" : ""}">${n ? `${sg(x)} <span class="small">(${better(m)}/${n})</span>` : "—"}</td>`; }).join("")) + "</tr>";
    }
    t += `<tr><td class="small">Paper (Table 2)</td>${seeds.map(() => "<td></td>").join("")}` + MET.map(([m]) => `<td class="num small">${f2(X.paper[m])}</td>`).join("") + "<td></td><td></td></tr>";
    body += `<h2 style="margin-top:12px">${esc(names[exp] || exp)} <span class="small">${n} / 5 seeds finished</span></h2><div class="scroll"><table>${t}</table></div>`;
  }
  el.innerHTML = `<summary><span class="grow">E19 results · epoch-selection rule (test set)</span>${badge(total === 10 ? "done" : "running", total === 10 ? "all seeds in" : `preliminary · ${total} / 10 runs`)}</summary>
    <div class="inner">${body}<p class="note">Each rule picks an epoch on the validation set from the same 10-epoch run; the cells are that epoch's test metrics. Δ = rule − paper rule on the same seed (seeds better in brackets). Preliminary until all seeds finish: no significance tests yet, and the paper rule here can differ from the original E16 runs by GPU non-determinism.</p></div>`;
  el.open = isOpen("sel", true);
}

function render(d) {
  const Q = d.queues, active = Q.find((x) => x.state === "running") || Q.find((x) => x.state === "failed");
  $("qbadge").innerHTML = active ? badge(active.state, (active.state === "running" ? "Running: " : "Failed: ") + active.title) : badge("done", "No queue running");
  const P = (d.plan && d.plan.items) || [], pd = P.filter((x) => x.state === "done").length;
  const runs = active ? active.jobs.filter((r) => r.experiment) : [], done = runs.filter((r) => r.state === "done").length;
  const frac = active ? runs.reduce((a, r) => a + (r.state === "done" ? 1 : r.state === "running" ? Math.min(0.95, (r.elapsed_s || 0) / (r.est || active.eta.per_run_s)) : 0), 0) / runs.length : 0;
  const g = d.gpu[0];
  $("tiles").innerHTML = `
    <div class="tile"><div class="k">Plan</div><div class="v">${pd} / ${P.length} done</div><div class="bar"><i style="width:${(100 * pd / Math.max(P.length, 1)).toFixed(1)}%"></i></div><div class="n">${P.filter((x) => x.state === "running").length} running</div></div>
    <div class="tile"><div class="k">Active queue</div><div class="v">${active ? `${done} / ${runs.length}` : "—"}</div><div class="bar"><i style="width:${(100 * frac).toFixed(1)}%"></i></div><div class="n">${active ? esc(active.title) : "nothing on the GPU"}</div></div>
    <div class="tile"><div class="k">Expected finish</div><div class="v">${active && active.state === "running" ? esc(active.eta.finish || "—") : "—"}</div><div class="n">${active && active.state === "running" ? `≈ ${dur(active.eta.remaining_s)} left · ${active.eta.measured ? "measured" : "estimated"}` : ""}</div></div>
    <div class="tile"><div class="k">GPU</div><div class="v">${g ? Math.round(g.util) + "%" : "—"}</div><div class="n">${g ? `${(g.mem_used / 1024).toFixed(1)} of ${(g.mem_total / 1024).toFixed(0)} GB · ${esc(g.temp)} °C` : "nvidia-smi unavailable"}</div></div>`;
  $("plan").innerHTML = `<tr><th>#</th><th>Item</th><th>Kind</th><th>State</th><th>Notes</th></tr>` + P.map((x, i) =>
    `<tr><td class="lane">${i + 1}</td><td class="wrap">${esc(x.title)}</td><td><span class="kind">${esc(x.kind)}</span></td><td>${badge(x.state)}</td><td class="wrap small">${esc(x.detail)}</td></tr>`).join("");
  $("plannote").textContent = d.plan ? `Plan updated ${d.plan.updated}. ${d.plan.note}` : "plan.json not found";
  $("queues").innerHTML = Q.slice().reverse().map(queueCard).join("");
  renderBaselines(d); renderExp4(d); renderSel(d);
  $("gpu").innerHTML = d.gpu.length ? d.gpu.map((x) => `<div>${esc(x.name)}</div>
      <div class="small" style="margin-top:8px">Utilisation ${Math.round(x.util)}%</div><div class="bar"><i style="width:${Number(x.util)}%"></i></div>
      <div class="small" style="margin-top:8px">Memory ${(x.mem_used / 1024).toFixed(1)} / ${(x.mem_total / 1024).toFixed(0)} GB</div><div class="bar"><i style="width:${(100 * x.mem_used / x.mem_total).toFixed(1)}%"></i></div>
      <div class="small" style="margin-top:8px">${esc(x.temp)} °C${x.power != null ? ` · ${Math.round(x.power)} W` : ""}</div>`).join("") : '<span class="small">nvidia-smi unavailable</span>';
  $("events").innerHTML = d.events.length ? d.events.map((e) => `<div class="ev">${esc(String(e.t).slice(5, 10))} ${esc(String(e.t).slice(11, 19))} · ${esc(e.job)} · ${esc(e.event)}${e.rc != null ? ` · rc ${esc(e.rc)}` : ""}${e.secs ? ` · ${dur(e.secs)}` : ""}</div>`).join("") : '<span class="small">no events yet</span>';
  $("stamp").textContent = "updated " + d.now;
}

async function refresh() {
  try { const r = await fetch(q("/api/state"), {cache: "no-store"}); if (!r.ok) throw new Error(r.status); render(await r.json()); }
  catch (e) { $("stamp").textContent = `could not reach the server (${e.message}); retrying`; }
  loadLogs();
}
refresh(); setInterval(refresh, 15000);
</script>
</body>
</html>
